baseURL             = "https://luizbon.com"
languageCode        = "en-AU"
publishDir          = "public"
buildDrafts         = false
canonifyURLs        = false
enableGitInfo       = true
enableRobotsTXT     = true
theme               = "hugo-PaperMod"
author              = "Luiz Bon"
title               = "Luiz Bon"
copyright           = "Luiz Bon"
disqusShortname     = "luizbon" # Comment out to disable Disqus.
pluralizeListTitles = false
# googleAnalytics     = "UA-123-45"

[imaging]
resampleFilter = "box"
anchor         = "smart"

[permalinks]
blog = "blog/:slug/"

# Plain-text index of the site, published at /llms.txt, for LLM retrieval.
[outputFormats.LLMS]
mediaType     = "text/plain"
baseName      = "llms"
isPlainText   = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "LLMS"]

[[menu.main]]
name       = "Blog"
weight     = -120
identifier = "blog"
url        = "/blog/"

[[menu.main]]
name       = "About"
weight     = -110
identifier = "about"
url        = "/about/"

[params]
author      = "Luiz Bon"
description = "Luiz Bon is an engineering manager in Sydney writing about event-driven .NET on Azure, platform engineering, and governing AI coding agents inside an engineering organisation."
keywords    = ["Luiz Bon", ".NET", "Azure", "event-driven architecture", "MCP", "engineering leadership", "platform engineering", "Sydney"]
DateFormat  = "January 2, 2006"

# Emit the full post body in the RSS feed rather than a summary, so
# aggregators and crawlers can read a post without fetching the page.
ShowFullTextinRSS = true

ShowReadingTime     = true
ShowBreadCrumbs     = true
ShowPostNavLinks    = true
ShowCodeCopyButtons = true
ShowToc             = true
TocOpen             = false
ShowWordCount       = true
ShowRssButtonInSectionTermList = true

[params.homeInfoParams]
Title   = "Luiz Bon"
Content = "Engineering manager in Sydney. I write about event-driven .NET on Azure, platform engineering, and how AI coding agents fit safely into an engineering organisation."

# Drives the Person entity in the homepage JSON-LD (see themes/hugo-PaperMod
# /layouts/partials/templates/schema_json.html) and the header social links.
[params.schema]
publisherType = "Person"
sameAs = [
  "https://github.com/luizbon",
  "https://www.linkedin.com/in/luizbon",
  "https://luizbon.com",
]

[[params.socialIcons]]
name = "github"
url  = "https://github.com/luizbon"

[[params.socialIcons]]
name = "linkedin"
url  = "https://www.linkedin.com/in/luizbon"

[[params.socialIcons]]
name = "rss"
url  = "https://luizbon.com/index.xml"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
